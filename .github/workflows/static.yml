# Publish ws/ to GitHub Pages: the workspaces and library.json, the
# index a browser reads. sw-apl's page fetches them across origins,
# which works because Pages answers every request with
# Access-Control-Allow-Origin: *. Nothing is built here; what is
# served is byte for byte what is committed.
name: Publish the library to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is running.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the library
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./ws"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
